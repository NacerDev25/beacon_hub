<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Desktop apps, screen readers, and audio games for blind and low-vision users." data-i18n-attr="content:page.computer.description">
  <title data-i18n="page.computer.title">Beacon Hub — Computer</title>
  <link rel="icon" href="images/beacon-hub-mark.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skipLink">Skip to main content</a>

  <header class="site-header">
    <div class="site-header__bar">
      <p class="site-brand">
        <img class="site-brand__mark" src="images/beacon-hub-mark.svg" alt="" width="40" height="40">
        <span class="site-brand__name">Beacon Hub</span>
      </p>

      <form class="site-search" role="search">
        <label class="site-search__label" for="site-search" data-i18n="search.label">Search</label>
        <input class="site-search__input" id="site-search" name="q" type="search">
      </form>

      <button class="icon-button" type="button" id="settings-button" aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7h-9"></path>
          <path d="M14 17H5"></path>
          <circle cx="17" cy="17" r="3"></circle>
          <circle cx="7" cy="7" r="3"></circle>
        </svg>
        <span class="visually-hidden" data-i18n="settings.open">Settings</span>
      </button>
    </div>

    <nav class="primary-nav" aria-label="Main navigation" data-i18n-attr="aria-label:nav.label">
      <ul class="primary-nav__list">
        <li><a class="primary-nav__link" href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a class="primary-nav__link" href="phone.html" data-i18n="nav.phone">Phone</a></li>
        <li><a class="primary-nav__link" href="computer.html" aria-current="page" data-i18n="nav.computer">Computer</a></li>
        <li><a class="primary-nav__link" href="channels.html" data-i18n="nav.channels">Channels</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    <h1 data-i18n="page.computer.heading">Computer</h1>
  </main>

  <footer class="site-footer">
    <p>Beacon Hub</p>
  </footer>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-dialog-title">
    <div class="settings-dialog__header">
      <h2 class="settings-dialog__title" id="settings-dialog-title" data-i18n="settings.title">Settings</h2>
      <button class="icon-button settings-dialog__close" type="button" id="settings-close-button">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="m6 6 12 12"></path>
          <path d="m18 6-12 12"></path>
        </svg>
        <span class="visually-hidden" data-i18n="settings.close">Close settings</span>
      </button>
    </div>

    <div class="settings-dialog__body">
      <div class="settings-option">
        <div class="settings-option__copy">
          <p class="settings-option__label" data-i18n="settings.theme.label">Site appearance</p>
        </div>
        <button class="icon-button theme-toggle" type="button" id="theme-toggle" aria-label="Dark mode" aria-pressed="false" data-i18n-attr="aria-label:settings.theme.toggleLabel">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
            <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
            <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
          </span>
        </button>
      </div>
      <p class="visually-hidden" id="theme-status" role="status" aria-live="polite" aria-atomic="true"></p>

      <div class="settings-option">
        <div class="settings-option__copy">
          <label class="settings-option__label" for="language-select" data-i18n="settings.language.label">Language</label>
        </div>
        <select class="settings-select" id="language-select" name="language">
          <option value="en" lang="en" data-i18n="language.name.en">English</option>
          <option value="fr" lang="fr" data-i18n="language.name.fr">Français</option>
          <option value="ar" lang="ar" data-i18n="language.name.ar">العربية</option>
        </select>
      </div>
      <p class="visually-hidden" id="language-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </dialog>
  <script src="js/i18n.js"></script>
</body>
</html>
