<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon Hub - القنوات والمجتمعات</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">تخطي إلى المحتوى الرئيسي</a>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <h1 class="site-title">Beacon Hub</h1>
        <p class="site-slogan">اكتشف التكنولوجيا، واستعملها باستقلالية</p>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-content" role="main">
    <section class="tabs-section" aria-label="القنوات والمجتمعات">
      <div class="tabs" role="tablist" aria-label="قنوات يوتيوب أو مجموعات تيليغرام">
        <button type="button" class="tab-btn is-active" role="tab" aria-selected="true" data-tab="youtube">قنوات يوتيوب</button>
        <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="telegram">مجموعات تيليغرام</button>
      </div>

      <div class="tab-panel is-active" role="tabpanel" data-tab-panel="youtube">
        <section class="content-block" aria-labelledby="yt-title">
          <header class="block-header">
            <h2 id="yt-title" class="block-title">قنوات يوتيوب</h2>
          </header>
          <div class="card-list" role="list">
            <article class="card" role="listitem">
              <h3 class="card-title">قريبًا</h3>
              <p class="card-text">سيتم إضافة القنوات قريبًا</p>
            </article>
          </div>
        </section>
      </div>

      <div class="tab-panel" role="tabpanel" data-tab-panel="telegram" hidden>
        <section class="content-block" aria-labelledby="tg-title">
          <header class="block-header">
            <h2 id="tg-title" class="block-title">مجموعات تيليغرام</h2>
          </header>
          <div class="card-list" role="list">
            <article class="card" role="listitem">
              <h3 class="card-title">قريبًا</h3>
              <p class="card-text">سيتم إضافة المجموعات قريبًا</p>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" role="navigation" aria-label="التنقل الرئيسي السفلي">
    <ul class="bottom-nav-list">
      <li class="bottom-nav-item">
        <a href="index.html" class="bottom-nav-link">
          <span class="bottom-nav-text">الرئيسية</span>
        </a>
      </li>
      <li class="bottom-nav-item">
        <a href="apps.html" class="bottom-nav-link">
          <span class="bottom-nav-text">التطبيقات</span>
        </a>
      </li>
      <li class="bottom-nav-item">
        <a href="channels.html" class="bottom-nav-link is-active" aria-current="page">
          <span class="bottom-nav-text">القنوات والمجتمعات</span>
        </a>
      </li>
      <li class="bottom-nav-item">
        <a href="more.html" class="bottom-nav-link">
          <span class="bottom-nav-text">المزيد</span>
        </a>
      </li>
    </ul>
  </nav>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-text">Beacon Hub - مشروع مجاني لخدمة المكفوفين وضعاف البصر</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
